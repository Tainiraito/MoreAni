name: CI

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv venv
      - run: uv pip install -r backend/requirements-dev.txt ruff==0.16.3
      - run: .venv/bin/ruff check backend/
      - run: .venv/bin/ruff format --check backend/
      - run: .venv/bin/pytest backend/tests
