name: CI

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv venv
      - run: uv pip install -r backend/requirements-dev.txt ruff==0.16.3
      - run: .venv/bin/ruff check backend/
      - run: .venv/bin/ruff format --check backend/
      - run: .venv/bin/pytest backend/tests

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - name: Build the exact release image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag moreani-app:${{ github.sha }} .
      - name: Smoke test the final image
        run: |
          set -Eeuo pipefail
          trap 'docker logs moreani-ci || true; docker rm -f moreani-ci || true' EXIT
          docker run --detach --name moreani-ci \
            --publish 18080:80 \
            --env SECRET_KEY=ci-only-secret \
            --env MOREANI_NOTIFICATION_WORKER=false \
            --env MOREANI_AIRING_CALENDAR_WORKER=false \
            moreani-app:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
