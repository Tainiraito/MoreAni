[supervisord]
nodaemon=true
user=root
logfile=/var/log/app/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/app/nginx-stdout.log
stderr_logfile=/var/log/app/nginx-stderr.log

[program:uvicorn]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app/backend
environment=DATABASE_URL="sqlite:////app/data/moreani.db"
autostart=true
autorestart=true
stdout_logfile=/var/log/app/uvicorn-stdout.log
stderr_logfile=/var/log/app/uvicorn-stderr.log
stopwaitsecs=10
