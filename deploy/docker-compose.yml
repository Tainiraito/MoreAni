services:
  moreani-app:
    # 预构建镜像（WSL2 构建后 docker save/load 传输，NAS 无法访问 Docker Hub 构建）
    image: moreani-app:latest
    container_name: moreani-app
    restart: unless-stopped
    ports:
      - "12555:80"
    environment:
      # 必填：JWT 签名密钥（生产必须显式设置，否则重启后所有登录失效）
      - SECRET_KEY=${SECRET_KEY:?请在 deploy/.env 中设置 SECRET_KEY}
      - DATABASE_URL=sqlite:////app/data/moreani.db
      # 生产环境只允许 HTTPS 公网前端来源；本地开发请单独设置 ALLOWED_ORIGINS
      - MOREANI_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://moreani.lovelysia.top}
      - TRUSTED_PROXY_NETWORKS=${TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - MOREANI_COOKIE_SECURE=${MOREANI_COOKIE_SECURE:-true}
      # 封面本地化目录（挂载卷内）
      - COVERS_DIR=/app/data/covers
      - AVATARS_DIR=/app/data/avatars
      # 单 Uvicorn worker 内运行资源更新通知检测
      - MOREANI_NOTIFICATION_WORKER=${MOREANI_NOTIFICATION_WORKER:-true}
      - MOREANI_NOTIFICATION_INTERVAL_SECONDS=${MOREANI_NOTIFICATION_INTERVAL_SECONDS:-1800}
      # Bangumi 周历每日同步；接口只读取本地数据库，不在用户请求时访问上游
      - MOREANI_AIRING_CALENDAR_WORKER=${MOREANI_AIRING_CALENDAR_WORKER:-true}
      - MOREANI_AIRING_COVER_PREFETCH=${MOREANI_AIRING_COVER_PREFETCH:-true}
      - MOREANI_AIRING_COVER_CONCURRENCY=${MOREANI_AIRING_COVER_CONCURRENCY:-4}
      - MOREANI_AIRING_COVER_MAX_BYTES=${MOREANI_AIRING_COVER_MAX_BYTES:-8388608}
      - MOREANI_COVER_ORPHAN_RETENTION_DAYS=${MOREANI_COVER_ORPHAN_RETENTION_DAYS:-365}
      - MOREANI_COVER_CLEANUP_ENABLED=${MOREANI_COVER_CLEANUP_ENABLED:-false}
      - MOREANI_RATE_LIMIT_IMAGE=${MOREANI_RATE_LIMIT_IMAGE:-120}
      - MOREANI_RATE_LIMIT_IMAGE_WINDOW_SECONDS=${MOREANI_RATE_LIMIT_IMAGE_WINDOW_SECONDS:-60}
      - MOREANI_PROXY_IMAGE_MAX_BYTES=${MOREANI_PROXY_IMAGE_MAX_BYTES:-8388608}
      # Bangumi API：优先走显式代理，失败后回退直连；不读取 ALL_PROXY
      - MOREANI_BANGUMI_PROXY=${MOREANI_BANGUMI_PROXY:-}
      - MOREANI_BANGUMI_REQUEST_ORDER=${MOREANI_BANGUMI_REQUEST_ORDER:-proxy_first}
      - MOREANI_BANGUMI_TIMEOUT_SECONDS=${MOREANI_BANGUMI_TIMEOUT_SECONDS:-8}
      - MOREANI_BANGUMI_CACHE_ENABLED=${MOREANI_BANGUMI_CACHE_ENABLED:-true}
      - MOREANI_BANGUMI_DETAIL_CACHE_SECONDS=${MOREANI_BANGUMI_DETAIL_CACHE_SECONDS:-300}
      - MOREANI_BANGUMI_SEARCH_CACHE_SECONDS=${MOREANI_BANGUMI_SEARCH_CACHE_SECONDS:-60}
      - MOREANI_BANGUMI_SCORE_CACHE_SECONDS=${MOREANI_BANGUMI_SCORE_CACHE_SECONDS:-60}
      - MOREANI_BANGUMI_CACHE_MAX_ENTRIES=${MOREANI_BANGUMI_CACHE_MAX_ENTRIES:-256}
      # 图片代理：显式代理地址由部署环境提供，不读取 ALL_PROXY
      - http_proxy=${MOREANI_HTTP_PROXY:-}
      - https_proxy=${MOREANI_HTTPS_PROXY:-}
    volumes:
      - ../data:/app/data
      - ../data/nginx-cache:/var/cache/nginx/moreani
      - ../logs/nginx:/var/log/nginx
      - ../logs/app:/var/log/app
    networks:
      - moreani

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: moreani-tunnel
    restart: unless-stopped
    command: tunnel run --protocol http2
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?请在 deploy/.env 中设置 CF_TUNNEL_TOKEN}
    networks:
      - moreani

networks:
  moreani:
    driver: bridge
