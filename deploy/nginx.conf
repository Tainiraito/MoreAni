user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 3m;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # 本地封面和外链代理共用持久化磁盘缓存；proxy_cache_lock 防止同一资源并发击穿。
    proxy_cache_path /var/cache/nginx/moreani levels=1:2 keys_zone=moreani_cover_cache:20m
                     max_size=1g inactive=365d use_temp_path=off;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'" always;

        # 前端静态文件
        root /usr/share/nginx/html;
        index index.html;

        # SPA 路由
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存（Vite 构建带 hash）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 已经预热的 subject 封面：长期 immutable，URL 的 v 参数负责版本更新。
        location /api/covers/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache moreani_cover_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache $upstream_cache_status always;
        }

        # 外链图片仅作为失败降级路径，命中 Nginx 缓存时不进入 Uvicorn/外部 CDN。
        location = /api/v1/proxy/image {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache moreani_cover_cache;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 60s;
            proxy_cache_valid 500 10s;
            proxy_cache_valid 502 10s;
            proxy_cache_valid 503 10s;
            proxy_cache_valid 504 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache $upstream_cache_status always;
        }

        # API 反代到 uvicorn
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
